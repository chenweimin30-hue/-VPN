name: Update Proxies

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run collector
        run: python scripts/collector.py
      
      - name: Validate and deduplicate proxies
        run: python scripts/validate_proxies.py
      
      - name: Generate Clash config
        run: python scripts/convert_to_clash.py
      
      - name: Generate V2Ray config
        run: python scripts/convert_to_v2ray.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add proxies.txt clash_config.yaml v2ray_config.json v2rayn_links.txt *.log
          git diff --cached --quiet || (git commit -m "Auto update: collect, validate and generate configs" && git push)
